name: C++ CI Workflow

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  pull-requests: write
  contents: read

jobs:
  check-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -skf -H "Authorization: token $GITHUB_TOKEN" "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open&per_page=1" 2>&1)
          echo "API response: ${response}"
          count=$(echo "$response" | grep -c '"number"' || true)
          echo "has_pr=$( [ "$count" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            build_enabled: true
          - os: macos-26-intel
            platform: macos-x64
            build_enabled: true
          - os: windows-latest
            platform: windows-x64
            build_enabled: true
          - os: ubuntu-latest
            platform: ubuntu-x64
            build_enabled: false
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      # opt into Node 24 runtime: ilammy/msvc-dev-cmd and llvm/actions/install-ninja still target Node 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        if: ${{ matrix.build_enabled }}
        uses: actions/checkout@v7

      - name: Run clang-format check
        # formatting is platform-independent, so a single run on the dev platform suffices
        if: ${{ matrix.build_enabled && matrix.os == 'macos-latest' }}
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            brew install clang-format
          fi
          bash build/check-format.sh

      - name: Setup Ninja
        # ninja 1.13.x ships preinstalled on github-hosted windows runners; skip the
        # node-20-based llvm/actions/install-ninja step there to avoid the Node deprecation
        # warning and use the bundled ninja instead.
        if: ${{ matrix.build_enabled && runner.os != 'Windows' }}
        uses: llvm/actions/install-ninja@main

      - name: Setup MSVC toolchain
        if: ${{ matrix.build_enabled && runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.platform }}-

      - name: Setup vcpkg
        if: ${{ matrix.build_enabled }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset release -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake --preset release
          fi

      - name: Build C++ Target
        if: ${{ matrix.build_enabled }}
        run: |
          cmake --build --preset release

      - name: Run C++ Tests
        if: ${{ matrix.build_enabled }}
        shell: bash
        # run the test executable directly, not ctest (see AGENTS.md)
        # the Ui-prefixed suites construct real wxWidgets windows, which crash in
        # the non-interactive windows runner session; macOS runs everything
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./.build-release/tests/kicad-xyce-plugin-tests.exe --gtest_filter=-Ui*
          else
            ./.build-release/tests/kicad-xyce-plugin-tests
          fi

      - name: Upload build artifact
        if: ${{ matrix.build_enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ matrix.platform }}
          path: .build-release/kicad-xyce-plugin${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  osx-universal:
    name: macOS Universal Binary
    needs: [build-and-test]
    runs-on: macos-latest
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-arm64
          path: artifacts/arm64

      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-x64
          path: artifacts/x64

      - name: Create Universal binary
        run: |
          lipo -create -output kicad-xyce-plugin \
            artifacts/arm64/kicad-xyce-plugin \
            artifacts/x64/kicad-xyce-plugin

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-macos-universal
          path: kicad-xyce-plugin
          if-no-files-found: error
          retention-days: 7

  package-and-release:
    name: Package & Release
    needs: [build-and-test, osx-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-windows-x64
          path: artifacts/windows

      - name: Download macOS Universal artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-universal
          path: artifacts/macos

      - name: Package Windows
        run: |
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/windows/kicad-xyce-plugin.exe kicad-xyce-plugin.exe windows
          mkdir -p packages
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Package macOS Universal
        run: |
          chmod +x artifacts/macos/kicad-xyce-plugin
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/macos/kicad-xyce-plugin kicad-xyce-plugin macos
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS Universal package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ github.ref_name }}' --clobber \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
