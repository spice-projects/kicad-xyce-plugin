name: C++ CI Workflow

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  pull-requests: write
  contents: read

jobs:
  check-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -skf -H "Authorization: token $GITHUB_TOKEN" "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open&per_page=1" 2>&1)
          echo "API response: ${response}"
          count=$(echo "$response" | grep -c '"number"' || true)
          echo "has_pr=$( [ "$count" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            build_enabled: true
          - os: macos-26-intel
            platform: macos-x64
            build_enabled: true
          - os: windows-latest
            platform: windows-x64
            build_enabled: false
          - os: ubuntu-latest
            platform: ubuntu-x64
            build_enabled: false
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
    steps:
      - name: Checkout repository
        if: ${{ matrix.build_enabled }}
        uses: actions/checkout@v7

      - name: Run clang-format check
        if: ${{ matrix.build_enabled && matrix.os == 'macos-latest' }}
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            brew install clang-format
          fi
          bash build/check-format.sh

      - name: Setup Ninja
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: pip install ninja

      - name: Setup MSVC toolchain
        if: ${{ matrix.build_enabled && runner.os == 'Windows' }}
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VS_PATH="$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          echo "Visual Studio installation path: $VS_PATH"
          printf '@echo off\r\ncall "%s\\VC\\Auxiliary\\Build\\vcvars64.bat" >nul\r\nset\r\n' "$VS_PATH" > vcvars_env.cmd
          cmd /c vcvars_env.cmd | tr -d '\r' | grep '=' |
            while IFS='=' read -r key value; do
              printf '%s<<EOF\n%s\nEOF\n' "$key" "$value"
            done >> "$GITHUB_ENV"
          rm -f vcvars_env.cmd

      - name: Restore vcpkg binary cache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.platform }}-

      - name: Setup vcpkg
        if: ${{ matrix.build_enabled }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        if: ${{ matrix.build_enabled }}
        shell: bash
        # the windows clang-cl toolchain is selected inside CMakeLists.txt (cc/cxx env + vcpkg overlay triplet)
        run: cmake --preset release

      - name: Build C++ Target
        if: ${{ matrix.build_enabled }}
        run: |
          cmake --build --preset release

      - name: Run C++ Tests
        if: ${{ matrix.build_enabled }}
        shell: bash
        # run the test executable directly, not ctest (see AGENTS.md)
        # the Ui-prefixed suites construct real native windows, which crash in
        # the non-interactive windows runner session; macOS runs everything
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./.build-release/tests/kicad-xyce-plugin-tests.exe --gtest_filter=-Ui*
          else
            ./.build-release/tests/kicad-xyce-plugin-tests
          fi

      - name: Upload build artifact
        if: ${{ matrix.build_enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ matrix.platform }}
          # the macos builds ship the shared slint library beside the executable; when the
          # windows build is re-enabled this needs a .dll entry again
          path: |
            .build-release/kicad-xyce-plugin${{ runner.os == 'Windows' && '.exe' || '' }}
            .build-release/libslint_cpp.dylib
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: C++ Coverage
    needs: [check-pr]
    # coverage runs only on the canonical repo; fork PRs are covered by the
    # gated pull_request_target workflow (coverage-fork.yml) after approval
    if: |-
      !cancelled() &&
      github.repository == 'spice-projects/kicad-xyce-plugin' &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # permissions are the ceiling passed down to the reusable workflow's
    # upload-coverage job (code-quality: write is required by the API upload)
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    uses: ./.github/workflows/coverage.yml

  osx-universal:
    name: macOS Universal Binary
    needs: [build-and-test]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && needs.build-and-test.result == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-arm64
          path: artifacts/arm64

      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-x64
          path: artifacts/x64

      - name: Create Universal binary
        run: |
          lipo -create -output kicad-xyce-plugin \
            artifacts/arm64/kicad-xyce-plugin \
            artifacts/x64/kicad-xyce-plugin
          lipo -create -output libslint_cpp.dylib \
            artifacts/arm64/libslint_cpp.dylib \
            artifacts/x64/libslint_cpp.dylib
          # the executable records the build machine's absolute path to the slint library,
          # which does not exist on user machines; rewrite it to a relocatable @rpath name
          # resolved beside the executable in the installed package
          old_path=$(otool -L kicad-xyce-plugin | awk '/libslint_cpp\.dylib/ {print $1}')
          install_name_tool -change "$old_path" @rpath/libslint_cpp.dylib kicad-xyce-plugin
          install_name_tool -id @rpath/libslint_cpp.dylib libslint_cpp.dylib
          install_name_tool -add_rpath @executable_path kicad-xyce-plugin
          # lipo and install_name_tool drop or invalidate ad-hoc signatures, and arm64
          # refuses to load mach-o files without a valid one
          codesign --force --sign - kicad-xyce-plugin
          codesign --force --sign - libslint_cpp.dylib

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-macos-universal
          path: |
            kicad-xyce-plugin
            libslint_cpp.dylib
          if-no-files-found: error
          retention-days: 7

  package-and-release:
    name: Package & Release
    needs: [build-and-test, osx-universal]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && needs.osx-universal.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-windows-x64
          path: artifacts/windows

      - name: Download macOS Universal artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-universal
          path: artifacts/macos

      - name: Package Windows
        run: |
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/windows/kicad-xyce-plugin.exe kicad-xyce-plugin.exe windows
          mkdir -p packages
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Package macOS Universal
        run: |
          chmod +x artifacts/macos/kicad-xyce-plugin artifacts/macos/libslint_cpp.dylib
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/macos/kicad-xyce-plugin kicad-xyce-plugin macos artifacts/macos/libslint_cpp.dylib
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS Universal package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ github.ref_name }}' --clobber \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
