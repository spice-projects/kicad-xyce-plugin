name: C++ CI Workflow

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  pull-requests: write
  contents: read

jobs:
  check-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -skf -H "Authorization: token $GITHUB_TOKEN" "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open&per_page=1" 2>&1)
          echo "API response: ${response}"
          count=$(echo "$response" | grep -c '"number"' || true)
          echo "has_pr=$( [ "$count" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_enabled: true
          - os: windows-latest
            build_enabled: true
          - os: ubuntu-latest
            build_enabled: false
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
    steps:
      - name: Checkout repository
        if: ${{ matrix.build_enabled }}
        uses: actions/checkout@v7

      - name: Setup Ninja
        if: ${{ matrix.build_enabled }}
        uses: llvm/actions/install-ninja@main

      - name: Setup MSVC toolchain
        if: ${{ matrix.build_enabled && runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        if: ${{ matrix.build_enabled }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset release -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake --preset release
          fi

      - name: Build C++ Target
        if: ${{ matrix.build_enabled }}
        run: |
          cmake --build --preset release

      # - name: Run C++ Tests
      #   if: ${{ matrix.build_enabled }}
      #   run: |
      #     ./.build-release/tests/kicad-xyce-plugin-tests

  python-coverage:
    name: Python Coverage
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        working-directory: python
        run: |
          pip install pytest pytest-cov

      - name: Run tests with coverage
        shell: bash
        working-directory: python
        run: |
          python -m pytest --cov=src --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python
          path: python/coverage.xml

  upload-coverage-python:
    needs: [python-coverage]
    if: ${{ !cancelled() && needs.python-coverage.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: coverage-report-python

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage-agent
