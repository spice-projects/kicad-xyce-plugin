name: C++ CI Workflow

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  pull-requests: write
  contents: read

jobs:
  check-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -skf -H "Authorization: token $GITHUB_TOKEN" "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open&per_page=1" 2>&1)
          echo "API response: ${response}"
          count=$(echo "$response" | grep -c '"number"' || true)
          echo "has_pr=$( [ "$count" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            build_enabled: true
          - os: macos-26-intel
            platform: macos-x64
            build_enabled: true
          - os: windows-latest
            platform: windows-x64
            build_enabled: true
          - os: ubuntu-latest
            platform: ubuntu-x64
            build_enabled: false
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
    steps:
      - name: Checkout repository
        if: ${{ matrix.build_enabled }}
        uses: actions/checkout@v7

      - name: Run clang-format check
        if: ${{ matrix.build_enabled && matrix.os == 'macos-26' }}
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            brew install clang-format
          fi
          bash build/check-format.sh

      - name: Setup Ninja
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: pip install ninja

      - name: Restore vcpkg binary cache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.os }}-build-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-build-

      - name: Setup vcpkg
        if: ${{ matrix.build_enabled }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup ccache
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ccache
            elif [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get install -y -qq ccache
            elif [ "$RUNNER_OS" = "Windows" ]; then
              choco install ccache
            fi
          fi

      - name: Restore ccache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.os }}-build-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-build-

      - name: Setup MSVC dev environment
        if: ${{ matrix.build_enabled && runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          validate: false

      - name: Configure CMake
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: cmake --preset release

      - name: Build C++ Target
        if: ${{ matrix.build_enabled }}
        run: |
          cmake --build --preset release

      - name: Run C++ Tests
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./.build-release/tests/kicad-xyce-plugin-tests.exe --gtest_filter=-Ui*
          else
            ./.build-release/tests/kicad-xyce-plugin-tests
          fi

      - name: Gather runtime dependencies
        if: ${{ matrix.build_enabled }}
        run: cmake --install .build-release --component RuntimeDeps --prefix .build-release

      - name: Upload build artifact
        if: ${{ matrix.build_enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ matrix.platform }}
          path: .build-release/artifacts/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: C++ Coverage
    needs: [check-pr]
    if: |-
      !cancelled() &&
      github.repository == 'spice-projects/kicad-xyce-plugin' &&
      (github.event_name != 'push' || needs.check-pr.outputs.has_pr == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    uses: ./.github/workflows/coverage.yml

  osx-universal:
    name: macOS Universal Binary
    needs: [build-and-test]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && needs.build-and-test.result == 'success' }}
    runs-on: macos-26
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-arm64
          path: artifacts/arm64

      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-x64
          path: artifacts/x64

      - name: Create Universal binary
        run: |
          mkdir -p artifacts/universal
          for file in artifacts/arm64/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            if [ -f "artifacts/x64/$name" ]; then
              lipo -create -output "artifacts/universal/$name" "artifacts/arm64/$name" "artifacts/x64/$name"
            else
              cp "$file" "artifacts/universal/$name"
            fi
          done

          # Rewrite library install names to @rpath and re-sign
          for dylib in artifacts/universal/*.dylib; do
            [ -f "$dylib" ] || continue
            dname=$(basename "$dylib")
            old_path=$(otool -L artifacts/universal/kicad-xyce-plugin | awk -v pat="$dname" '$1 ~ pat {print $1}')
            if [ -n "$old_path" ]; then
              install_name_tool -change "$old_path" "@rpath/$dname" artifacts/universal/kicad-xyce-plugin
            fi
            install_name_tool -id "@rpath/$dname" "$dylib"
            codesign --force --sign - "$dylib"
          done
          install_name_tool -add_rpath @executable_path artifacts/universal/kicad-xyce-plugin 2>/dev/null || true
          codesign --force --sign - artifacts/universal/kicad-xyce-plugin

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-macos-universal
          path: artifacts/universal/
          if-no-files-found: error
          retention-days: 7

  package-and-release:
    name: Package & Release
    needs: [build-and-test, osx-universal]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && needs.osx-universal.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-windows-x64
          path: artifacts/windows

      - name: Download macOS Universal artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-universal
          path: artifacts/macos

      - name: Package Windows
        run: |
          dlls=$(ls artifacts/windows/*.dll 2>/dev/null | tr '\n' ' ')
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/windows/kicad-xyce-plugin.exe kicad-xyce-plugin.exe windows "$dlls"
          mkdir -p packages
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Package macOS Universal
        run: |
          chmod +x artifacts/macos/*
          dylibs=$(ls artifacts/macos/*.dylib 2>/dev/null | tr '\n' ' ')
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/macos/kicad-xyce-plugin kicad-xyce-plugin macos "$dylibs"
          mkdir -p packages
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS Universal package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ github.ref_name }}' --clobber \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
