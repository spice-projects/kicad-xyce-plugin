name: C++ CI Workflow

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  pull-requests: write
  contents: read

jobs:
  check-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -skf -H "Authorization: token $GITHUB_TOKEN" "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open&per_page=1" 2>&1)
          echo "API response: ${response}"
          count=$(echo "$response" | grep -c '"number"' || true)
          echo "has_pr=$( [ "$count" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            build_enabled: true
          - os: macos-26-intel
            platform: macos-x64
            build_enabled: true
          - os: windows-latest
            platform: windows-x64
            build_enabled: false
          - os: ubuntu-latest
            platform: ubuntu-x64
            build_enabled: false
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
    steps:
      - name: Checkout repository
        if: ${{ matrix.build_enabled }}
        uses: actions/checkout@v7

      - name: Run clang-format check
        if: ${{ matrix.build_enabled && matrix.os == 'macos-latest' }}
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            brew install clang-format
          fi
          bash build/check-format.sh

      - name: Setup Ninja
        if: ${{ matrix.build_enabled && runner.os != 'Windows' }}
        shell: bash
        run: pip install ninja

      - name: Setup MSVC toolchain
        if: ${{ matrix.build_enabled && runner.os == 'Windows' }}
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VS_PATH="$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          echo "Visual Studio installation path: $VS_PATH"
          printf '@echo off\r\ncall "%s\\VC\\Auxiliary\\Build\\vcvars64.bat" >nul\r\nset\r\n' "$VS_PATH" > vcvars_env.cmd
          cmd /c vcvars_env.cmd | tr -d '\r' | grep '=' |
            while IFS='=' read -r key value; do
              printf '%s<<EOF\n%s\nEOF\n' "$key" "$value"
            done >> "$GITHUB_ENV"
          rm -f vcvars_env.cmd

      - name: Restore vcpkg binary cache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.platform }}-

      - name: Setup vcpkg
        if: ${{ matrix.build_enabled }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset release -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake --preset release
          fi

      - name: Build C++ Target
        if: ${{ matrix.build_enabled }}
        run: |
          cmake --build --preset release

      - name: Run C++ Tests
        if: ${{ matrix.build_enabled }}
        shell: bash
        # run the test executable directly, not ctest (see AGENTS.md)
        # the Ui-prefixed suites construct real wxWidgets windows, which crash in
        # the non-interactive windows runner session; macOS runs everything
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./.build-release/tests/kicad-xyce-plugin-tests.exe --gtest_filter=-Ui*
          else
            ./.build-release/tests/kicad-xyce-plugin-tests
          fi

      - name: Upload build artifact
        if: ${{ matrix.build_enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ matrix.platform }}
          path: .build-release/kicad-xyce-plugin${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: C++ Coverage
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    runs-on: macos-latest
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ninja
        shell: bash
        run: pip install ninja

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-macos-arm64-profile-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-macos-arm64-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake (Profile)
        run: cmake --preset profile

      - name: Build C++ Test Target (Profile)
        run: cmake --build --preset profile --target kicad-xyce-plugin-tests

      - name: Run C++ Tests with coverage instrumentation
        shell: bash
        # run the test executable directly, not ctest (see AGENTS.md);
        # skip the Ui-prefixed suites like the Windows job since this is a
        # non-interactive runner session and they are not worth the flakiness
        # for coverage numbers
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage.profraw
        run: |
          ./.build-profile/tests/kicad-xyce-plugin-tests --gtest_filter=-Ui*

      - name: Generate Cobertura report
        shell: bash
        run: |
          xcrun llvm-profdata merge -sparse coverage.profraw -o coverage.profdata
          xcrun llvm-cov export \
            -instrprofile coverage.profdata \
            -format=lcov \
            -sources "$PWD/src" \
            ./.build-profile/tests/kicad-xyce-plugin-tests > coverage.lcov
          pip install lcov_cobertura
          lcov_cobertura coverage.lcov --output cobertura.xml

      - name: Upload coverage report artifact
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-report
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 7

  upload-coverage:
    name: Upload Coverage
    needs: [coverage]
    if: ${{ !cancelled() && !failure() && needs.coverage.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: cobertura-report

      - name: Upload to GitHub code coverage API
        uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: C++
          label: code-coverage/c++

  osx-universal:
    name: macOS Universal Binary
    needs: [build-and-test]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && needs.build-and-test.result == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-arm64
          path: artifacts/arm64

      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-x64
          path: artifacts/x64

      - name: Create Universal binary
        run: |
          lipo -create -output kicad-xyce-plugin \
            artifacts/arm64/kicad-xyce-plugin \
            artifacts/x64/kicad-xyce-plugin

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-macos-universal
          path: kicad-xyce-plugin
          if-no-files-found: error
          retention-days: 7

  package-and-release:
    name: Package & Release
    needs: [build-and-test, osx-universal]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && needs.osx-universal.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-windows-x64
          path: artifacts/windows

      - name: Download macOS Universal artifact
        uses: actions/download-artifact@v8
        with:
          name: kicad-xyce-plugin-macos-universal
          path: artifacts/macos

      - name: Package Windows
        run: |
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/windows/kicad-xyce-plugin.exe kicad-xyce-plugin.exe windows
          mkdir -p packages
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Package macOS Universal
        run: |
          chmod +x artifacts/macos/kicad-xyce-plugin
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}' artifacts/macos/kicad-xyce-plugin kicad-xyce-plugin macos
          mv dist/kicad-xyce-plugin-${{ steps.version.outputs.version }}.zip \
             packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS Universal package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal-package
          path: packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ github.ref_name }}' --clobber \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-windows-x64.zip \
            packages/kicad-xyce-plugin-${{ steps.version.outputs.version }}-macos-universal.zip
